ice(0,5).map(i=>`<div class="listrow"><div><b>${esc(i.number)}</b><div class="hint">${esc(i.customerName||'Cliente')} · ${esc(i.deliveryAddress||'Dirección pendiente')}</div></div><span class="pill yellow">${esc(i.deliveryStatus)}</span></div>`).join('')||'<div class="empty">No hay entregas pendientes.</div>'}</div></div>`}
function productTile(p){const si=myStore();const qty=isAdmin()&&si==='all'?state.stores.reduce((x,s)=>x+qtyStock(s.id,p.id),0):qtyStock(si||'principal',p.id);return `<button class="ptile" data-act="addcart" data-id="${q(p.id)}" ${qty<=0?'disabled':''}><span style="font-size:23px">📦</span><b>${esc(p.name)}</b><div class="row between"><small>${money(p.price)}</small><span class="pill ${qty<=0?'red':'green'}">${qty} und</span></div></button>`}
function posPage(){let storeId=role.storeId||state.stores[0]?.id;if(isAdmin()&&filterStore!=='all')storeId=filterStore;const opts=state.stores.map(s=>[s.id,s.name]);const current=state._posStore||storeId;const cust=state.customers.filter(c=>c.storeId===current);const available=state.products.filter(p=>p.active!==false&&qtyStock(current,p.id)>0);return `<div class="pos"><div><div class="panel"><div class="panelhead"><h2>🛒 Facturar accesorios</h2><span class="pill red">Precio no menor al mínimo</span></div>${isAdmin()?`<div class="field" style="max-width:300px;margin-bottom:12px"><label>Tienda que vende</label>${fsel('posStore',opts,current).replace('name="posStore"','id="posStore" name="posStore"')}</div>`:`<div class="notice info" style="margin-bottom:12px">Tienda: ${esc(storeName(current))}</div>`}<div class="field" style="margin-bottom:14px"><label>Buscar accesorio, código o categoría</label><input id="productsearch" placeholder="Ej. Cargador, cable USB, mica..." autocomplete="off"></div><div class="producttiles" id="producttiles">${available.map(productTile).join('')||'<div class="empty">Sin productos disponibles. Registra mercadería desde Inventario.</div>'}</div></div></div><div class="panel"><div class="panelhead"><h2>Detalle de la venta</h2><button class="btn tiny" data-act="clearcart">Limpiar</button></div><form id="checkoutForm"><div id="cartlines">${cartHtml()}</div><div class="divider"></div><div class="formgrid"><div class="field wide"><label>Cliente</label><div class="row" style="flex-wrap:nowrap"><select name="customerId" style="width:100%;padding:11px;border:1px solid #d8dce1;border-radius:11px"><option value="">Consumidor final</option>${cust.map(c=>`<option value="${q(c.id)}">${esc(c.name)} — ${esc(c.phone||'')}</option>`).join('')}</select><button type="button" class="btn" data-act="newcustomer" title="Agregar cliente">+</button></div></div><div class="field"><label>Forma de pago</label>${fsel('paymentMethod',[['efectivo','Efectivo'],['transferencia','Transferencia'],['tarjeta','Tarjeta'],['otro','Otro']])}</div><div class="field"><label>¿Quién recibió el dinero?</label>${fsel('collectedBy',[['socio','Socio / tienda'],['jcell','JCELL directamente']])}</div><div class="field wide"><label>Entrega del pedido</label>${fsel('deliveryType',[['retiro','Retira en tienda'],['delivery','Delivery a domicilio']])}</div><div class="field delivery-fields hidden"><label>Tarifa delivery para JCELL ($)</label><input name="deliveryFee" type="number" ${currencyInput('0')}></div><div class="field delivery-fields hidden"><label>Teléfono de entrega</label><input name="deliveryPhone" type="tel" placeholder="09..."></div><div class="field wide delivery-fields hidden"><label>Dirección de entrega</label><textarea name="deliveryAddress" placeholder="Dirección, referencia, ubicación Maps"></textarea></div><div class="field wide"><label>Observaciones del ticket (opcional)</label><input name="note" placeholder="Color, garantía, etc."></div></div><div class="divider"></div><div id="billtotal">${cartTotals()}</div><button class="btn primary w100" style="margin-top:15px" type="submit">🧾 Registrar venta y generar comprobante</button></form></div></div>`}
function cartHtml(){if(!cart.length)return `<div class="empty">Selecciona productos para agregarlos al carrito.</div>`;return cart.map((l,i)=>`<div class="cartrow" data-cart="${i}"><div class="details"><div><b>${esc(product(l.productId)?.name||'Producto')}</b><div class="hint">Mínimo: ${money(product(l.productId)?.minPrice)} · Stock: ${qtyStock(state._posStore||role.storeId||state.stores[0]?.id,l.productId)}</div></div><button class="btn tiny" type="button" data-act="delcart" data-i="${i}">✕</button></div><div class="controls"><label class="hint">Cant. <input class="qtyinput" type="number" min="1" step="1" data-qty="${i}" value="${l.qty}"></label><label class="hint">Precio $ <input class="priceinput" type="number" step="0.01" min="${product(l.productId)?.minPrice||0}" data-price="${i}" value="${l.price.toFixed(2)}"></label><b style="margin-left:auto">${money(l.qty*l.price)}</b></div></div>`).join('')}
function cartTotals(){const base=cart.reduce((a,l)=>a+l.qty*l.price,0);return `<div class="summaryline"><span>Subtotal accesorios</span><b>${money(base)}</b></div><div class="summaryline" id="feeLine"><span>Delivery (JCELL 100%)</span><b>${money(window.deliveryVal||0)}</b></div><div class="summaryline total"><span>Total a cobrar</span><span>${money(base+n(window.deliveryVal))}</span></div>`}
function inventory(){const storeOpts=state.stores.map(s=>[s.id,s.name]);const stores=isAdmin()?state.stores.filter(s=>filterStore==='all'||s.id===filterStore):state.stores.filter(s=>s.id===role.storeId);const data=stores.flatMap(s=>state.products.map(p=>({store:s,product:p,qty:qtyStock(s.id,p.id)}))).filter(x=>x.qty!==0||isAdmin());return `<div class="panel"><div class="panelhead"><h2>📦 Inventario por tienda</h2><div class="row">${filterBox()}${isAdmin()?`<button class="btn primary" data-modal="product">+ Producto</button><button class="btn" data-modal="stockin">+ Entrega</button>`:''}</div></div><div class="notice info" style="margin-bottom:14px">Cada tienda tiene sus existencias independientes. Un traspaso resta unidades en origen y las suma en destino.</div><div class="tablewrap"><table><thead><tr><th>Producto</th><th>Código</th><th>Tienda</th><th>Stock</th><th>Precio mínimo</th><th>Precio sugerido</th>${isAdmin()?'<th>Costo</th><th>Editar</th>':''}</tr></thead><tbody>${data.map(({store:s,product:p,qty:qt})=>`<tr><td><b>${esc(p.name)}</b><div class="hint">${esc(p.category||'General')}</div></td><td>${esc(p.sku||'—')}</td><td>${esc(s.name)}</td><td><span class="pill ${qt<=0?'red':qt<=n(p.lowStock)?'yellow':'green'}">${qt} uds.</span></td><td>${money(p.minPrice)}</td><td>${money(p.price)}</td>${isAdmin()?`<td>${money(p.cost)}</td><td><button class="btn tiny" data-modal="product" data-id="${q(p.id)}">Editar</button></td>`:''}</tr>`).join('')||'<tr><td colspan="8" class="empty">Sin mercadería todavía.</td></tr>'}</tbody></table></div></div>${isAdmin()?`<div class="grid2"><div class="panel"><div class="panelhead"><h3>Traspasos de mercadería</h3><button class="btn primary" data-modal="transfer">↔ Traspasar</button></div><div class="hint">Mover stock entre tiendas, dejando registro de quién lo transfirió y cuándo.</div>${state.transfers.slice().reverse().slice(0,8).map(t=>`<div class="listrow"><div><b>${esc(product(t.productId)?.name||t.productName)}</b> · ${t.qty} und. function salesPage(){const arr=relevantInvoices();const totals=issued().reduce((a,i)=>{const x=invoiceTotals(i);a.sub+=x.subtotal;a.cap+=x.capital;a.gain+=x.profit;a.del+=x.delivery;return a},{sub:0,cap:0,gain:0,del:0});return `${metricsCards([['Accesorios vendidos',money(totals.sub),'Total facturado sin envíos','🛒'],['Capital vendido',money(totals.cap),'Recuperación del costo','📦'],['Utilidad comercial',money(totals.gain),'Mitad para cada parte','💸'],['Delivery para JCELL',money(totals.del),'100% del valor de envío','🚚']])}<div class="panel"><div class="panelhead"><h2>🧾 Historial de ventas</h2><div class="row">${filterBox()}<button class="btn" data-act="exportcsv">Exportar CSV</button></div></div><div class="tablewrap"><table><thead><tr><th>Comprobante</th><th>Fecha</th><th>Tienda</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Compartir</th></tr></thead><tbody>${arr.map(i=>`<tr><td><b>${esc(i.number)}</b><div class="hint">${esc(i.sellerName)}</div></td><td>${date(i.saleAt)}</td><td>${esc(storeName(i.storeId))}</td><td>${esc(i.customerName||'Consumidor final')}</td><td class="strong">${money(invoiceTotals(i).total)}</td><td><span class="pill ${i.status==='emitida'?'green':'red'}">${esc(i.status)}</span></td><td><button class="btn tiny outline" data-act="receipt" data-id="${q(i.id)}">🧾 Ver</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sin ventas registradas.</td></tr>'}</tbody></table></div></div>`}
function customersPage(){const arr=state.customers.filter(visible);return `<div class="panel"><div class="panelhead"><h2>👥 Clientes registrados (${arr.length})</h2><div class="row">${filterBox()}<button class="btn primary" data-modal="customer">+ Nuevo cliente</button></div></div><div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Teléfono</th><th>Correo</th><th>Dirección</th><th>Tienda</th><th>Acciones</th></tr></thead><tbody>${arr.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td><a href="tel:${q(c.phone)}">${esc(c.phone||'—')}</a></td><td>${esc(c.email||'—')}</td><td>${esc(c.address||'—')}</td><td>${esc(storeName(c.storeId))}</td><td><button class="btn tiny" data-modal="customer" data-id="${q(c.id)}">Editar</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Agrega un cliente para conservar su historial.</td></tr>'}</tbody></table></div></div>`}
function deliveriesPage(){const arr=relevantInvoices().filter(i=>i.deliveryType==='delivery');return `${metricsCards([['Pedidos delivery',String(arr.filter(i=>i.status==='emitida').length),'Vigentes','📦'],['Por entregar',String(arr.filter(i=>i.status==='emitida'&&i.deliveryStatus!=='entregado').length),'Pendientes / en ruta','🚚'],['Envíos cobrados',money(arr.filter(i=>i.status==='emitida').reduce((a,i)=>a+n(i.deliveryFee),0)),'100% para JCELL','💵'],['Entregados',String(arr.filter(i=>i.status==='emitida'&&i.deliveryStatus==='entregado').length),'Historial','✅']])}<div class="panel"><div class="panelhead"><h2>🚚 Mis entregas a domicilio</h2>${filterBox()}</div><div class="tablewrap"><table><thead><tr><th>Pedido</th><th>Cliente / contacto</th><th>Dirección</th><th>Delivery</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${arr.map(i=>`<tr><td><b>${esc(i.number)}</b><div class="hint">${date(i.saleAt)}</div></td><td>${esc(i.customerName||'Cliente')}<div class="hint">${esc(i.deliveryPhone||'')}</div></td><td>${esc(i.deliveryAddress||'—')}</td><td class="strong">${money(i.deliveryFee)}</td><td><span class="pill ${i.deliveryStatus==='entregado'?'green':'yellow'}">${esc(i.deliveryStatus)}</span></td><td>${isAdmin()&&i.status==='emitida'?`<button class="btn tiny" data-act="delivery" data-id="${q(i.id)}">Actualizar</button>`:''}<button class="btn tiny outline" data-act="receipt" data-id="${q(i.id)}">Ver</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No hay pedidos de delivery.</td></tr>'}</tbody></table></div></div>`}
function reportsPage(){const list=issued().filter(i=>inPeriod(i.saleAt)),total=list.reduce((a,i)=>a+invoiceTotals(i).subtotal,0),profit=list.reduce((a,i)=>a+invoiceTotals(i).profit,0),del=list.reduce((a,i)=>a+invoiceTotals(i).delivery,0);const lines=list.flatMap(salesForReceipt);const byProduct=new Map();for(const l of lines){const x=byProduct.get(l.productId)||{name:l.name,qty:0,sale:0};x.qty+=l.qty;x.sale+=l.qty*l.unitPrice;byProduct.set(l.productId,x)}const top=[...byProduct.values()].sort((a,b)=>b.qty-a.qty).slice(0,10);const byStore=state.stores.filter(s=>isAdmin()&&(filterStore==='all'||s.id===filterStore)||!isAdmin()&&s.id===role.storeId).map(s=>{const inv=list.filter(i=>i.storeId===s.id);return {name:s.name,count:inv.length,amount:inv.reduce((a,i)=>a+invoiceTotals(i).total,0),balance:accountBalance(s.id).balance}});const bySeller=new Map();for(const i of list){const x=bySeller.get(i.sellerUid)||{name:i.sellerName,count:0,total:0};x.count++;x.total+=invoiceTotals(i).total;bySeller.set(i.sellerUid,x)}return `<div class="panel"><div class="panelhead"><h2>📊 Nivel de ventas y reportes</h2><div class="filterbar">${filterBox()}<select id="period"><option value="7" ${period==='7'?'selected':''}>7 días</option><option value="30" ${period==='30'?'selected':''}>30 días</option><option value="90" ${period==='90'?'selected':''}>90 días</option><option value="all" ${period==='all'?'selected':''}>Todo</option></select></div></div>${metricsCards([['Facturación',money(total+del),'Productos y delivery','📈'],['Utilidad accesorios',money(profit),'50/50 entre ambos','💸'],['Tu parte JCELL',money(profit/2+del),'50% + delivery','🏪'],['Pedidos',String(list.length),'Comprobantes emitidos','🧾']])}<div class="grid2"><div class="panel"><h3>🏆 Productos más vendidos</h3>${top.map(x=>`<div class="listrow"><div style="flex:1"><div class="progress"><span>${esc(x.name)}</span><b>${x.qty} und.</b></div><div class="bar"><span style="width:${Math.round(x.qty/Math.max(1,top[0]?.qty)*100)}%"></span></div></div><span class="money">${money(x.sale)}</span></div>`).join('')||'<div class="empty">Aún no hay datos.</div>'}</div><div class="panel"><h3>🏪 Resultados por tienda</h3>${byStore.map(s=>`<div class="listrow"><div><b>${esc(s.name)}</b><div class="hint">${s.count} comprobantes</div></div><div style="text-align:right"><b>${money(s.amount)}</b><div class="hint">Saldo: ${money(s.balance)}</div></div></div>`).join('')||'<div class="empty">Sin datos.</div>'}<div class="divider"></div><h3>🥇 Ranking vendedores</h3>${[...bySeller.values()].sort((a,b)=>b.total-a.total).map((s,i)=>`<div class="listrow"><span>${i+1}. ${esc(s.name)}</span><b>${money(s.total)}</b></div>`).join('')||'<div class="empty">Sin ventas.</div>'}</div></div></div>`}
function cashPage(){const sessions=state.cashSessions.filter(visible).sort((a,b)=>b.openAt.localeCompare(a.openAt));const open=sessions.find(x=>!x.closeAt);const receipts=issued().filter(i=>i.paymentMethod==='efectivo');const expenses=state.expenses.filter(visible);const subtotal=receipts.reduce((a,i)=>a+invoiceTotals(i).total,0), exp=expenses.reduce((a,e)=>a+n(e.amount),0);return `${metricsCards([['Ventas en efectivo',money(subtotal),'Historial de caja','💵'],['Gastos registrados',money(exp),'No alteran el 50/50','🧾'],['Sesión abierta',open?'Sí':'No','Por tienda y usuario','🔐'],['Cierres de caja',String(sessions.filter(s=>s.closeAt).length),'Auditoría','📋']])}<div class="grid2"><div class="panel"><div class="panelhead"><h3>💵 Apertura y cierre</h3><button class="btn primary" data-modal="${open?'cashclose':'cashopen'}">${open?'Cerrar caja':'Abrir caja'}</button></div>${open?`<div class="notice good">Caja abierta desde ${date(open.openAt)}<br>Base inicial: ${money(open.openingAmount)} · ${esc(storeName(open.storeId))}</div>`:'<div class="notice info">No hay una caja abierta para esta vista.</div>'}<div class="divider"></div><h3>Historial de sesiones</h3>${sessions.slice(0,8).map(s=>`<div class="listrow"><div>${esc(storeName(s.storeId))}<div class="hint">${date(s.openAt)} ${s.closeAt?'— '+date(s.closeAt):'· Abierta'}</div></div><b>${s.closeAt?money(s.closingAmount):'—'}</b></div>`).join('')||'<div class="empty">Sin cierres todavía.</div>'}</div><div class="panel"><div class="panelhead"><h3>Gastos y movimientos</h3><button class="btn" data-modal="expense">+ Gasto</button></div>${expenses.slice().reverse().slice(0,8).map(e=>`<div class="listrow"><div><b>${esc(e.concept)}</b><div class="hint">${esc(storeName(e.storeId))} · ${date(e.at)}</div></div><b>${money(e.amount)}</b></div>`).join('')||'<div class="empty">No hay gastos registrados.</div>'}</div></div>`}
function partnersPage(){if(!isAdmin())return '<div class="panel">Acceso reservado al administrador.</div>';return `<div class="grid2"><div class="panel"><div class="panelhead"><h2>🏪 Tiendas / socios</h2><button class="btn primary" data-modal="store">+ Nueva tienda</button></div>${state.stores.map(s=>{const a=accountBalance(s.id);return `<div class="listrow"><div><b>${esc(s.name)}</b><div class="hint">${esc(s.address||'Sin dirección')}</div></div><div style="text-align:right"><b style="color:${a.balance>=0?'var(--red)':'var(--ok)'}">${money(Math.abs(a.balance))}</b><div class="hint">${a.balance>=0?'El socio te debe':'Tú debes al socio'}</div><div class="row" style="justify-content:flex-end;margin-top:4px"><button class="btn tiny" data-modal="store" data-id="${q(s.id)}">Editar / metas</button><button class="btn tiny" data-modal="payment" data-store="${q(s.id)}">Liquidar</button></div></div></div>`}).join('')}</div><div class="panel"><div class="panelhead"><h2>🔁 Traspasos de mercadería</h2><button class="btn primary" data-modal="transfer">Nuevo traspaso</button></div><p class="hint">Transferir de Tienda A a Tienda B con descuento y aumento automático del stock correspondiente.</p>${state.transfers.slice().reverse().slice(0,7).map(t=>`<div class="listrow"><div><b>${esc(t.productName)}</b><div class="hint">${esc(storeName(t.fromStore))} → ${esc(storeName(t.toStore))}</div></div><b>${t.qty} und.</b></div>`).join('')||'<div class="empty">No hay traspasos.</div>'}</div><div class="panel"><div class="panelhead"><h2>👤 Usuarios vendedores</h2><button class="btn primary" data-modal="user">+ Crear usuario</button></div>${!online?'<div class="notice">Para iniciar sesión desde distintos celulares debes conectar Firebase. El modo local no crea usuarios reales.</div>':''}${state.users.map(u=>`<div class="listrow"><div><b>${esc(u.name)}</b><div class="hint">${esc(u.email)} · ${esc(storeName(u.storeId))}</div></div><span class="pill ${u.active?'green':'red'}">${u.active?'Activo':'Inac Cerrar sesión</button>`:''}</div><div class="panel"><h2>🔒 Reglas de seguridad Firestore</h2><p class="hint">En Firebase Console → Firestore Database → Reglas, pega las reglas generadas para TU UID. No uses reglas de prueba abiertas. Sin las reglas correctas las operaciones de nube serán rechazadas.</p><button class="btn primary" data-act="copyrules">📋 Copiar reglas</button><p class="hint">Los vendedores solo podrán facturar su tienda, no cambiar productos, costos ni stock libremente. Por limitaciones del cliente web, un vendedor técnicamente podría inspeccionar el costo en los datos recibidos; el precio y las liquidaciones sí se validan desde las reglas.</p></div><div class="panel"><h2>💾 Copia de seguridad local</h2><p class="hint">Exporta tus datos como JSON. En nube, Firebase es la fuente de datos y esta exportación es solo una copia de lo que tu sesión puede consultar.</p><div class="row"><button class="btn primary" data-act="backup">⬇️ Exportar respaldo JSON</button>${!online?'<button class="btn" data-act="restore">📤 Importar respaldo</button>':''}</div><input type="file" id="restoreFile" accept="application/json" class="hidden"><div class="divider"></div><p class="hint">Versión 1.0 · un solo archivo HTML · acceso web. Instalar como acceso directo en Chrome después de publicarlo en HTTPS; para APK real hace falta empaquetarlo.</p></div></div>`}

function paymentNote(){return 'El capital de los accesorios corresponde a JCELL. La utilidad sobre ese capital se divide 50/50. El delivery es ingreso 100% de JCELL.'}
function getData(form){return Object.fromEntries(new FormData(form).entries())}
async function save(col,obj){if(online){const f=sdk.db;await f.setDoc(f.doc(fs,'jcell',fbConfig.ownerUid,col,obj.id),obj)}else{const i=state[col].findIndex(x=>x.id===obj.id);if(i<0)state[col].push(obj);else state[col][i]=obj;persist();render()}}
async function update(col,objId,data){if(online)await sdk.db.updateDoc(sdk.db.doc(fs,'jcell',fbConfig.ownerUid,col,objId),data);else{const v=state[col].find(x=>x.id===objId);if(!v)throw Error('Registro no encontrado');Object.assign(v,data);persist();render()}}
async function saveBrand(brand){if(online)await sdk.db.setDoc(sdk.db.doc(fs,'jcell',fbConfig.ownerUid,'settings','brand'),brand);else{state.brand=brand;persist();render()}}
async function movement(storeId,productId,delta,type,note=''){if(!isAdmin())throw Error('Solo administrador puede mover mercadería');if(!storeId||!productId||!Number.isInteger(delta)||delta===0)throw Error('Datos inválidos');const m={id:id(),storeId,productId,delta,type,note,at:now(),by:role.uid};if(online){const f=sdk.db,ref=f.doc(fs,'jcell',fbConfig.ownerUid,'stock',storeId+'__'+productId),mref=f.doc(fs,'jcell',fbConfig.ownerUid,'movements',m.id);await f.runTransaction(fs,async tx=>{const ss=await tx.get(ref);const old=ss.exists()?n(ss.data().qty):0; if(old+delta<0)throw Error('Stock insuficiente en '+storeName(storeId));tx.set(ref,{storeId,productId,qty:old+delta,updatedAt:now(),lastLineId:''});tx.set(mref,m)})}else{if(qtyStock(storeId,productId)+delta<0)throw Error('Stock insuficiente');state.movements.push(m);persist();render()}}
async function transfer(d){if(!isAdmin())throw Error('Acceso denegado');const qt=iv(d.qty);if(!qt||d.fromStore===d.toStore)throw Error('Elige tiendas distintas y cantidad positiva');if(qtyStock(d.fromStore,d.productId)<qt)throw Error('No existe suficiente stock en origen');const t={id:id(),fromStore:d.fromStore,toStore:d.toStore,productId:d.productId,productName:product(d.productId)?.name||'',qty:qt,note:d.note||'',at:now(),by:role.uid};const left={id:id(),storeId:d.fromStore,productId:d.productId,delta:-qt,type:'TRASPASO_SALIDA',transferId:t.id,note:t.note,at:t.at,by:role.uid};const right={id:id(),storeId:d.toStore,productId:d.productId,delta:qt,type:'TRASPASO_ENTRADA',transferId:t.id,note:t.note,at:t.at,by:role.uid};if(online){const f=sdk.db,base=['jcell',fbConfig.ownerUid],src=f.doc(fs,...base,'stock',d.fromStore+'__'+d.productId),dst=f.doc(fs,...base,'stock',d.toStore+'__'+d.productId);await f.runTransaction(fs,async tx=>{const a=await tx.get(src),b=await tx.get(dst),old=n(a.data()?.qty);if(old<qt)throw Error('Stock de origen insuficiente');tx.set(src,{storeId:d.fromStore,productId:d.productId,qty:old-qt,updatedAt:now(),lastLineId:''});tx.set(dst,{storeId:d.toStore,productId:d.productId,qty:n(b.data()?.qty)+qt,updatedAt:now(),lastLineId:''});for(const [c,o] of [['transfers',t],['movements',left],['movements',right]])tx.set(f.doc(fs,...base,c,o.id),o)})}else{state.transfers.push(t);state.movements.push(left,right);persist();render()}}
function receiptNumber(){return 'JC-'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+String(Date.now()).slice(-6)+Math.floor(Math.random()*10)}
async function checkout(d){if(!cart.length)throw Error('Agrega por lo menos un accesorio');if(!d.storeId)throw Error('Selecciona una tienda');if(!canStore(d.storeId))throw Error('No tienes acceso a esa tienda');if(online&&cart.length>4)throw Error('En modo nube se permiten máximo 4 productos distintos por comprobante para validar correctamente las reglas. Puedes emitir dos comprobantes.');if(!['socio','jcell'].includes(d.collectedBy))throw Error('Responsable del cobro inválido');const lines=[];for(const c of cart){const p=product(c.productId);if(!p)throw Error('Producto eliminado');if(!Number.isInteger(c.qty)||c.qty<1)throw Error('Cantidad inválida');if(!Number.isFinite(c.price)||c.price<n(p.minPrice))throw Error('El precio de '+p.name+' no puede bajar de '+money(p.minPrice));if(qtyStock(d.storeId,p.id)<c.qty)throw Error('Stock insuficiente para '+p.name);lines.push({id:id(),invoiceId:'',storeId:d.storeId,productId:p.id,name:p.name,sku:p.sku||'',qty:c.qty,unitPrice:Math.round(c.price*100)/100,cost:n(p.cost),sellerUid:role.uid,saleAt:now()})}if(d.deliveryType==='delivery'&&(!d.deliveryAddress||!d.deliveryAddress.trim()))throw Error('La dirección de delivery es obligatoria');const fee=d.deliveryType==='delivery'?n(d.deliveryFee):0;if(!Number.isFinite(fee)||fee<0)throw Error('Tarifa de envío inválida');const cus=customer(d.customerId);const inv={id:id(),number:receiptNumber(),storeId:d.storeId,customerId:d.customerId||'',customerName:cus?.name||'Consumidor final',customerPhone:cus?.phone||'',sellerUid:role.uid,sellerName:role.name,method:d.paymentMethod,paymentMethod:d.paymentMethod,collectedBy:d.collectedBy,deliveryType:d.deliveryType,deliveryFee:fee,deliveryAddress:d.deliveryType==='delivery'?d.deliveryAddress:'',deliveryPhone:d.deliveryType==='delivery'?d.deliveryPhone:'',deliveryStatus:d.deliveryType==='delivery'?'pendiente':'retiro',note:d.note||'',status:'emitida',saleAt:now()};for(const l of lines){l.invoiceId=inv.id;l.saleAt=inv.saleAt}if(online){const f=sdk.db async function cancelSale(invId){if(!isAdmin())throw Error('Solo el administrador puede anular ventas');const inv=state.invoices.find(i=>i.id===invId);if(!inv||inv.status!=='emitida')return;if(!confirm('¿Anular '+inv.number+' y devolver los productos a su inventario?'))return;const lines=salesForReceipt(inv);if(online){const f=sdk.db,base=['jcell',fbConfig.ownerUid],refs=lines.map(l=>f.doc(fs,...base,'stock',l.storeId+'__'+l.productId));await f.runTransaction(fs,async tx=>{const snaps=[];for(const ref of refs)snaps.push(await tx.get(ref));for(let i=0;i<lines.length;i++){const l=lines[i];tx.set(refs[i],{storeId:l.storeId,productId:l.productId,qty:n(snaps[i].data()?.qty)+l.qty,lastLineId:'',updatedAt:now()})}tx.update(f.doc(fs,...base,'invoices',invId),{status:'anulada',cancelledAt:now(),cancelledBy:role.uid})})}else{inv.status='anulada';inv.cancelledAt=now();persist();render()}notify('Venta anulada y stock repuesto.')}

function csvDownload(){const rows=[['Nro','Fecha','Tienda','Cliente','Subtotal','Delivery','Total','Capital','JCELL utilidad','Socio utilidad','Cobrado por','Estado'],...relevantInvoices().map(i=>{const t=invoiceTotals(i);return [i.number,i.saleAt,storeName(i.storeId),i.customerName,t.subtotal,t.delivery,t.total,t.capital,t.profit/2,t.profit/2,i.collectedBy,i.status]})];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='JCELL_Ventas_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function rulesText(){const uid=(fbConfig?.ownerUid||'REEMPLAZA_CON_UID_ADMIN').replace(/[^A-Za-z0-9_-]/g,'');return `rules_version = '2';
service cloud.firestore {
 match /databases/{database}/documents {
  function logged() { return request.auth != null; }
  function owner() { return logged() && request.auth.uid == '${uid}'; }
  function profile() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data; }
  function seller(o) { return logged() && exists(/databases/$(database)/documents/users/$(request.auth.uid)) && profile().ownerUid == o && profile().role == 'seller' && profile().active == true; }
  function member(o) { return (owner() && o == '${uid}') || seller(o); }
  function myStore(o,s) { return (owner() && o == '${uid}') || (seller(o) && profile().storeId == s); }
  match /users/{uid} {
   allow get: if logged() && (owner() || request.auth.uid == uid);
   allow list, create, update, delete: if owner();
  }
  match /jcell/{o}/stores/{id} {
   allow read: if member(o);
   allow write: if owner() && o == '${uid}';
  }
  match /jcell/{o}/products/{id} {
   allow read: if member(o);
   allow write: if owner() && o == '${uid}';
  }
  match /jcell/{o}/settings/{id} {
   allow read: if member(o);
   allow write: if owner() && o == '${uid}';
  }
  match /jcell/{o}/movements/{id} {
   allow read: if myStore(o,resource.data.storeId);
   allow write: if owner() && o == '${uid}';
  }
  match /jcell/{o}/transfers/{id} {
   allow read, write: if owner() && o == '${uid}';
  }
  match /jcell/{o}/customers/{id} {
   allow read: if myStore(o,resource.data.storeId);
   allow create: if myStore(o,request.resource.data.storeId);
   allow update: if myStore(o,resource.data.storeId) && request.resource.data.storeId == resource.data.storeId;
   allow delete: if owner() && o == '${uid}';
  }
  match /jcell/{o}/invoices/{id} {
   allow read: if myStore(o,resource.data.storeId);
   allow create: if (owner() && o == '${uid}') ||
     (seller(o) && request.resource.data.storeId == profile().storeId &&
      request.resource.data.sellerUid == request.auth.uid &&
      request.resource.data.status == 'emitida' &&
      request.resource.data.deliveryFee is number &&
      request.resource.data.deliveryFee >= 0 &&
      request.resource.data.collectedBy in ['socio','jcell']);
   allow update,delete: if owner() && o == '${uid}';
  }
  match /jcell/{o}/salesLines/{id} {
   allow read: if myStore(o,resource.data.storeId);
   allow create: if (owner() && o == '${uid}') ||
     (seller(o) && request.resource.data.storeId == profile().storeId &&
      request.resource.data.sellerUid == request.auth.uid &&
      request.resource.data.qty is int && request.resource.data.qty > 0 &&
      request.resource.data.unitPrice is number &&
      request.resource.data.cost is number &&
      exists(/databases/$(database)/documents/jcell/$(o)/products/$(request.resource.data.productId)) &&
      request.resource.data.unitPrice >= get(/databases/$(database)/documents/jcell/$(o)/products/$(request.resource.data.productId)).data.minPrice &&
      request.resource.data.cost == get(/databases/$(database)/documents/jcell/$(o)/products/$(request.resource.data.productId)).data.cost &&
      getAfter(/databases/$(database)/documents/jcell/$(o)/invoices/$(request.resource.data.invoiceId)).data.storeId == request.resource.data.storeId &&
      getAfter(/databases/$(database)/documents/jcell/$(o)/invoices/$(request.resource.data.invoiceId)).data.sellerUid == request.auth.uid &&
      getAfter(/databases/$(database)/documents/jcell/$(o)/stock/$(request.resource.data.storeId + '__' + request.resource.data.productId)).data.lastLineId == id);
   allow update,delete: if owner() && o == '${uid}';
  }
  match /jcell/{o}/stock/{id} {
   allow read: if myStore(o,resource.data.storeId);
   allow create, delete: if owner() && o == '${uid}';
   allow update: if (owner() && o == '${uid}') ||
     (seller(o) && resource.data.storeId == profile().storeId &&
      request.resource.data.storeId == resource.data.storeId &&
      request.resource.data.productId == resource.data.productId &&
      request.resource.data.keys().hasOnly(['storeId','productId','qty','lastLineId','updatedAt']) &&
      request.resource.data.qty is int && request.resource.data.qty >= 0 &&
      request.resource.data.qty < resource.data.qty &&
      !exists(/databases/$(database)/documents/jcell/$(o)/salesLines/$(request.resource.data.lastLineId)) &&
      getAfter(/databases/$(database)/documents/jcell/$(o)/salesLines/$(request.resource.data.lastLineId)).data.qty == resource.data.qty - request.resource.data.qty &&
      getAfter(/databases/$(database)/documents/jcell/$(o)/salesLines/$(request.resource.data.lastLineId)).data.storeId == resource.data.storeId &&
      getAfter(/databases/$(database)/documents/jcell/$(o)/salesLines/$(request.resource.data.lastLineId)).data.productId == resource.data.productId &&
      getAfter(/databases/$(database)/documents/jcell/$(o)/salesLines/$(request.resource.data.lastLineId)).data.sellerUid == request.auth.uid);
  }
  match /jcell/{o}/payments/{id} {
   allow read: if myStore(o,resource.data.storeId);
   allow write: if owner() && o == '${uid}';
  }
  match /jcell/{o}/expenses/{id} {
   allow read: if myStore(o,resource.data.storeId);
   allow create: if myStore(o,request.resource.data.storeId);
   allow update,delete: if owner() && o == '${uid}';
  }
  match /jcell/{o}/cashSessions/{id} {
   allow read: if myStore(o,resource.data.storeId);
   allow create: if myStore(o,request.resource.data.storeId);
   allow update: if (owner() && o == '${uid}') ||
      (seller(o) && resource.data.storeId == profile().storeId &&
       resource.data.closeAt == '' &&
       request.resource.data.diff(resource.data).affectedKeys().hasOnly(['closeAt','closingAmount','note']) &&
       request.resource.data.closeAt is string);
   allow delete: if owner() && o == '${uid}';
  }
 }
}`}
function renderLogin(){const configured=Boolean(fbConfig?.projectId);$('#root').innerHTML=`<div class="login"><div class="login-card"><div class="row">${brandLogo()}<div><h1>JCELL STORES</h1><div class="subtle">Punto de venta · rojo y blanco</div></div></div>${configured?`<p>Inicia sesión con tu correo y contraseña asignados en Firebase.</p><form id="loginForm"><div class="field"><label>Correo electrónico</label><input name="email" type="email" required autocomplete="username"></div><div class="field"><label>Contraseña</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn primary w100">Iniciar sesión</button></form><button class="btn outline w100" data-act="localmode">Probar modo local en este celular</button><p class="hint">Si eres vendedor, solicita al administrador el enlace de configuración de JCELL POS y tu usuario.</p>`:`<p>Usa la demostración local o configura Firebase para sincronizar diferentes tiendas en distintos celulares.</p><button class="btn primary w100" data-act="localmode">Entrar al sistema local</button>`}</div></div>`}

async function bootCloud(){if(!fbConfig||demoLocal)return;renderLogin();try{const [app,a,d]=await Promise.all([import('https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js')]);sdk={app,auth:a,db:d};fa=app.getApps().find(v=>v.name==='jcell-primary')||app.initializeApp(fbConfig,'jcell-primary');auth=a.getAuth(fa);fs=d.getFirestore(fa);a.onAuthStateChanged(auth,async user=>{stopListeners();if(!user){online=false;role={uid:'',name:'',kind:'',storeId:null};renderLogin();return}try{if(!fbConfig.ownerUid){fbConfig.ownerUid=user.uid;localStorage.setItem(CFGKEY,JSON.stringify(fbConfig));notify('UID del primer administrador guardado. Publica las reglas Firestore antes de usar la nube.')}if(user.uid===fbConfig.ownerUid){role={uid:user.uid,name:user.email?.split('@')[0]||'Administrador',kind:'admin',storeId:null}}else{const snap=await d.getDoc(d.doc(fs,'users',user.uid));if(!snap.exists()||!snap.data().active||snap.data().ownerUid!==fbConfig.ownerUid){await a.signOut(auth);throw Error('Usuario no autorizado. Pide al administrador que cree tu acceso.')}const p=snap.data();role={uid:user.uid,name:p.name||'Vendedor',kind:'seller',storeId:p.storeId,monthlyGoal:n(p.monthlyGoal)}}online=true;state=blank();subscribeCloud();activeTab='inicio';render()}catch(e){online=false;notify(e.message,'error');renderLogin()}})}catch(e){notify('Error al cargar Firebase. Prueba con Chrome y conexión a internet. '+e.message,'error');demoLocal=true;render()}}
function stopListeners(){for(const u of listenerUnsubs)u();listenerUnsubs=[]}
function subscribeCloud(){if(!online)return;const d=sdk.db,base=['jcell',fbConfig.ownerUid];for(const col of collections){if(col==='users'&&!isAdmin())continue;if(col==='transfers'&&!isAdmin())continue;let query=d.collection(fs,...base,col);if(!isAdmin()&&!['stores','products'].includes(col))query=d.query(query,d.where('storeId','==',role.storeId));listenerUnsubs.push(d.onSnapshot(query,snap=>{state[col]=snap.docs.map(x=>({id:x.id,...x.data()}));if(col==='stores'&&!state.stores.length&&isAdmin()){}render()},e=>{notify('Firestore ('+col+'): '+e.message,'error')}))}listenerUnsubs.push(d.onSnapshot(d.doc(fs,...base,'settings','brand'),snap=>{state.brand={...blank().brand,...(snap.data()||{})};render()},e=>notify('No se pudo leer el logo: '+e.message,'error')))}
async function createUser(u){if(!online||!isAdmin())throw Error('Solo administrador en modo Firebase');if(!u.storeId||!u.email||!u.name)throw Error('Datos incompletos');const a=sdk.app,b=sdk.auth;const subapp=a.initializeApp(fbConfig,'jcell-secondary-'+id()),secondary=b.getAuth(subapp);let created;try{created=await b.createUserWithEmailAndPassword(secondary,u.email,u.password);const profile={id:created.user.uid,ownerUid:fbConfig.ownerUid,role:'seller',name:u.name,email:u.email,storeId:u.storeId,monthlyGoal:iv(u.monthlyGoal),active:true,createdAt:now()};await sdk.db.setDoc(sdk.db.doc(fs,'users',created.user.uid),profile);notify('Vendedor creado. Comparte la web JCELL y sus credenciales de manera privada.')}finally{await b.signOut(secondary).catch(()=>{});await a.deleteApp(subapp).catch(()=>{})}}
async function imageToJpg(file){if(!file)return null;if(!file.type.startsWith('image/'))throw Error('Debes elegir una imagen');const source=URL.createObjectURL(file);try{const img=new Image();img.src=source;await img.decode();const can=document.createElement('canvas');const f=Math.min(250/img.width,250/img.height,1);can.width=Math.max(1,Math.round(img.width*f));can.height=Math.max(1,Math.round(img.height*f));const ctx=can.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,can.width,can.height);ctx.drawImage(img,0,0,can.width,can.height);return can.toDataURL('image/jpeg',.72)}finally{URL.revokeObjectURL(source)}}
function exportBackup(){const blob=new Blob([JSON.stringify({version:1,createdAt:now(),data:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='JCELL_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function customerFormData(d,existing){if(!d.name.trim())throw Error('Nombre requerido');if(!canStore(d.storeId))throw Error('No puedes registrar clientes en otra tienda');return {id:existing?.id||id(),name:d.name.trim(),phone:(d.phone||'').trim(),email:(d.email||'').trim(),address:d.address||'',note:d.note||'',storeId:d.storeId,createdAt:existing?.createdAt||now(),updatedAt:now()}}
function formValidCost(d){const cost=n(d.cost),min=n(d.minPrice),price=n(d.price);if(!d.name?.trim()||!d.sku?.trim())throw Error('Nombre y SKU son obligatorios');if(cost<0||min<cost||price<min)throw Error('Precios incorrectos: costo ≤ mínimo ≤ sugerido');if(state.products.some(p=>p.sku.toLowerCase()===d.sku.toLowerCase()&&p.id!==d.id))throw Error('Ya existe ese código SKU');return {cost,minPrice:min,price}}
async function formSubmit(ev){ev.preventDefault();const f=ev.target;if(processing)return;processing=true;const btn=f.querySelector('button[type="submit"],button:not([type])');if(btn)btn.disabled=true;try{const d=getData(f),fid=f.id;
 if(fid==='loginForm'){if(!auth)throw Error('Firebase no está listo');await sdk.auth.signInWithEmailAndPassword(auth,d.email,d.password);return}
 if(fid==='configForm'){if(!d.apiKey||!d.authDomain||!d.projectId||!d.appId)throw Error('Faltan datos de Firebase');fbConfig={apiKey:d.apiKey.trim(),authDomain:d.authDomain.trim(),projectId:d.projectId.trim(),appId:d.appId.trim(),ownerUid:d.ownerUid.trim()};localStorage.setItem(CFGKEY,JSON.stringify(fbConfig));notify('Configuración guardada; iniciando Firebase.');demoLocal=false;stopListeners();await bootCloud();return}
 if(fid==='brandForm'){if(!isAdmin())throw Error('Solo administrador');const file=f.elements.logoFile.files[0],logo=file?await imageToJpg(file):state.brand.logo;await saveBrand({logo,business:d.business||'JCELL STORES',phone:d.phone||'',ruc:d.ruc||'',address:d.address||''});notify('Logo y datos comerciales guardados.');return}
 if(fid==='checkoutForm'){const storeId=state._posStore||role.storeId||state.stores[0]?.id;await checkout({...d,storeId});return}
 if(!fid.startsWith('f-'))return;
 if(fid==='f-product'){if(!isAdmin())throw Error('Solo administrador');const existing=state.products.find(p=>p.id===f.dataset.id)||null;const props=formValidCost({...d,id:existing?.id});await save('products',{id:existing?.id||id(),name:d.name.trim(),sku:d.sku.trim(),category:d.category||'General',barcode:d.barcode||'',lowStock:iv(d.lowStock),...props,active:true,createdAt:existing?.createdAt||now(),updatedAt:now()})}
 else if(fid==='f-store'){if(!isAdmin())throw Error('Solo administrador');await save('stores',{id:f.dataset.id||id(),name:d.name.trim(),phone:d.phone||'',address:d.address||'',monthlyGoal:iv(d.monthlyGoal),monthlyRevenueGoal:n(d.monthlyRevenueGoal),createdAt:state.stores.find(s=>s.id===f.dataset.id)?.createdAt||now()})}
 else if(fid==='f-customer'){const existing=state.customers.find(c=>c.id===f.dataset.id);await save('customers',customerFormData(d,existing))}
 else if(fid==='f-stockin'||fid==='f-stockout'){const qt=iv(d.qty);if(!qt)throw Error('Cantidad inválida');await movement(d.storeId,d.productId,fid==='f-stockin'?qt:-qt,fid==='f-stockin'?'ENTREGA':'DEVOLUCION',d.note)}
 else if(fid==='f-transfer')await transfer(d);
 else if(fid==='f-payment'){if(!isAdmin())throw Error('Solo administrador');if(n(d.amount)<=0)throw Error('Monto inválido');await save('payments',{id:id(),storeId:d.storeId,direction:d.direction,amount:n(d.amount),method:d.method,reference:d.reference||'',note:d.note||'',at:now(),by:role.uid})}
 else if(fid==='f-expense'){if(!canStore(d.storeId))throw Error('Tienda no autorizada');if(n(d.amount)<=0)throw Error('Monto inválido');await save('expenses',{id:id(),storeId:d.storeId,concept:d.concept,amount:n(d.amount),note:d.note||'',at:now(),by:role.uid})}
 else if(fid==='f-cashopen'){if(!canStore(d.storeId))throw Error('Tienda no autorizada');if(state.cashSessions.some(s=>s.storeId===d.storeId&&!s.closeAt))throw Error('Ya hay caja abierta en esta tienda');await save('cashSessions',{id:id(),storeId:d.storeId,openingAmount:n(d.openingAmount),openAt:now(),closeAt:'',closingAmount:null,openedBy:role.uid})}
 else if(fid==='f-cashclose'){await update('cashSessions',f.dataset.id,{closeAt:now(),closingAmount:n(d.closingAmount),note:d.note||''})}
 else if(fid==='f-user')await createUser(d);
 else if(fid==='f-delivery'){if(!isAdmin())throw Error('Solo administrador');await update('invoices',f.dataset.id,{deliveryStatus:d.deliveryStatus})}
 $('#modal').close();notify('Registro guardado correctamente.');render();
 }catch(err){notify(err.message||String(err),'error')}finally{processing=false;if(btn)btn.disabled=false}}
window.addEventListener('hashchange',()=>{});
function applySharedConfig(){const h=location.hash;if(!h.startsWith('#jcfg='))return;try{const json=decodeURIComponent(escape(atob(h.slice(6))));const cfg=JSON.parse(json);if(!cfg.projectId||!cfg.ownerUid)throw Error('Falta configuración');fbConfig=cfg;localStorage.setItem(CFGKEY,JSON.stringify(cfg));history.replaceState(null,'',location.pathname+location.search)}catch(e){console.warn('Configuración compartida inválida',e)}}
applySharedConfig();
function shareConfig(){if(!fbConfig?.ownerUid)throw Error('Primero conecta Firebase con tu UID');if(location.protocol==='file:')throw Error('Publica primero el archivo en un sitio HTTPS para compartir un enlace.');const data=btoa(unescape(encodeURIComponent(JSON.stringify(fbConfig))));return location.origin+location.pathname+'#jcfg='+data}
async function handleAct(act,e){const b=e.target.closest('[data-act]');const key=b?.dataset.id;switch(act){
case'closemodal':$('#modal').close();break;
case'localmode':startLocal();break;
case'signout':if(auth)await sdk.auth.signOut(auth);else startLocal();break;
case'copyrules':await navigator.clipboard.writeText(rulesText());notify('Reglas copiadas. Pégalas en Firestore → Reglas.');break;
case'copyconfig':await navigator.clipboard.writeText(shareConfig());notify('Enlace de configuración copiado para compartir con vendedores.');break;
case'backup':exportBackup();break;
case'restore':$('#restoreFile').click();break;
case'addcart':{const p=product(key),s=state._posStore||role.storeId||state.stores[0]?.id;if(!p||qtyStock(s,key)<=0)throw Error('Producto agotado');const exist=cart.find(x=>x.productId===key);if(exist){if(exist.qty+1>qtyStock(s,key))throw Error('Sin stock suficiente');exist.qty++}else{if(online&&cart.length>=4)throw Error('Máximo 4 accesorios distintos por comprobante en modo nube; puedes hacer otro ticket.');cart.push({productId:key,qty:1,price:Math.max(n(p.price),n(p.minPrice))})}render();break}
case'delcart':cart.splice(n(b.dataset.i),1);render();break;
case'clearcart':cart=[];window.deliveryVal=0;render();break;
case'newcustomer':openModal('customer');break;
case'receipt':openModal('receipt',{id:key});break;
case'cancel':await cancelSale(key);$('#modal').close();break;
case'delivery':openModal('delivery',{id:key});break;
case'whatsapp':{const inv=state.invoices.find(i=>i.id===key);window.open('https://wa.me/?text='+encodeURIComponent(receiptText(inv)),'_blank','noopener');break}
case'email':{const inv=state.invoices.find(i=>i.id===key);const c=customer(inv.customerId);location.href='mailto:'+(c?.email?encodeURIComponent(c.email):'')+'?subject='+encodeURIComponent('Comprobante JCELL '+inv.number)+'&body='+encodeURIComponent(receiptText(inv));break}
case'pdf':{const inv=state.invoices.find(i=>i.id===key);await sharePDF(inv);break}
case'exportcsv':csvDownload();break;
case'toggleuser':{const u=state.users.find(x=>x.id===key);if(!u||!online)throw Error('Usuario no disponible');await sdk.db.updateDoc(sdk.db.doc(fs,'users',key),{active:!u.active});notify('Estado de usuario actualizado.');break}
}}
document.addEventListener('submit',formSubmit);
document.addEventListener('click',async e=>{const b=e.target.closest('[data-go],[data-modal],[data-act]');if(!b)return;try{if(b.dataset.go){activeTab=b.dataset.go;if(activeTab!=='pos')window.deliveryVal=0;render();window.scrollTo(0,0)}else if(b.dataset.modal)openModal(b.dataset.modal,{id:b.dataset.id,store:b.dataset.store});else if(b.dataset.act)await handleAct(b.dataset.act,e)}catch(err){notify(err.message||String(err),'error')}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='storefilter'){filterStore=t.value;render()}else if(t.id==='period'){period=t.value;render()}else if(t.id==='posStore'){state._posStore=t.value;cart=[];render()}else if(t.name==='deliveryType'){const show=t.value==='delivery';document.querySelectorAll('.delivery-fields').forEach(el=>el.classList.toggle('hidden',!show));window.deliveryVal=show?n($('input[name="deliveryFee"]')?.value):0;$('#billtotal').innerHTML=cartTotals()}else if(t.matches('[data-qty]')){const i=+t.dataset.qty,c=cart[i],s=state._posStore||role.storeId||state.stores[0]?.id;const qt=iv(t.value);if(qt<1||qt>qtyStock(s,c.productId)){notify('Cantidad fuera de stock','error');t.value=c.qty;return}c.qty=qt;$('#cartlines').innerHTML=cartHtml();$('#billtotal').innerHTML=cartTotals()}else if(t.matches('[data-price]')){const i=+t.dataset.price,c=cart[i],min=n(product(c.productId)?.minPrice),val=Number(t.value);if(!Number.isFinite(val)||val<min){notify('Precio mínimo: '+money(min),'error');t.value=c.price.toFixed(2);return}c.price=Math.round(val*100)/100;$('#cartlines').innerHTML=cartHtml();$('#billtotal').innerHTML=cartTotals()}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='productsearch'){const query=t.value.toLowerCase().trim(),store=state._posStore||role.storeId||state.stores[0]?.id;$('#producttiles').innerHTML=state.products.filter(p=>p.active!==false&&qtyStock(store,p.id)>0&&[p.name,p.sku,p.category,p.barcode].some(z=>String(z||'').toLowerCase().includes(query))).map(productTile).join('')||'<div class="empty">No hay productos con ese nombre.</div>'}else if(t.name==='deliveryFee'){window.deliveryVal=Math.max(0,n(t.value));if($('#billtotal'))$('#billtotal').innerHTML=cartTotals()}});
document.addEventListener('change',async e=>{if(e.target.id==='restoreFile'){const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.data?.stores||!d.data?.products)throw Error('No es un respaldo válido');if(!confirm('¿Reemplazar TODOS los datos locales con este respaldo?'))return;state={...blank(),...d.data};persist();render();notify('Copia restaurada.')}catch(err){notify(err.message,'error')}}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').close()});
if(fbConfig)bootCloud();else startLocal();
</script></body></html>
